name: Release (Windows)

# Windows installer zip (TotK-Setup), built in CI without any game file: the release carries no game data, and the
# player's own setup lifts and builds the game on their machine.
#   - A tag v* publishes a release.
#   - "Run workflow" (Actions tab) builds the zip as a downloadable artifact; give it a tag name (for example
#     v0.3.11-test) to publish that run as a pre-release as well.
# The runtime library is built against recomp/layout.py's reference layout (tools/make_release.py, layout_source).
# Optional, never in this repo: secrets GAME_INPUTS_URL (+ GAME_INPUTS_TOKEN) point at a private zip with
# generated/v143/** (and build/extracted/v143/** for --prove); when GAME_INPUTS_URL is set the job restores it and
# builds against that layout and runs --prove instead.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      prove:
        description: "Run make_release --prove (needs extracted game inputs in the private zip)"
        type: boolean
        default: false
      tag:
        description: "Publish this run as a pre-release with this tag (empty: artifact only)"
        type: string
        default: ""

permissions:
  contents: write

env:
  PY312: "3.12"
  PY314: "3.14"
  HAVE_GAME_INPUTS: ${{ secrets.GAME_INPUTS_URL != '' }}

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY312 }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY314 }}

      - name: Install uv
        shell: pwsh
        run: |
          irm https://astral.sh/uv/install.ps1 | iex
          uv --version

      - name: Python venvs (lifter + extraction tools)
        shell: pwsh
        run: |
          uv venv --python ${{ env.PY312 }} .venv
          uv pip install --python .venv/Scripts/python.exe -r tools/requirements.txt
          uv venv --python ${{ env.PY314 }} .venv-py314
          uv pip install --python .venv-py314/Scripts/python.exe -r tools/requirements-py314.txt

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          release: false   # the runner's own C:\msys64: tools/build_game.py and build_hactool.py use that path
          update: false
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-libvpx
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            base-devel
            git
            unzip

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch pinned reference checkouts (shader list history)
        shell: bash
        run: bash tools/fetch_refs.sh

      - name: Build hactool
        shell: pwsh
        run: .venv\Scripts\python tools\build_hactool.py

      - name: Restore private game inputs (optional)
        if: env.HAVE_GAME_INPUTS == 'true'
        shell: pwsh
        env:
          GAME_INPUTS_URL: ${{ secrets.GAME_INPUTS_URL }}
          GAME_INPUTS_TOKEN: ${{ secrets.GAME_INPUTS_TOKEN }}
        run: |
          $headers = @{}
          if ($env:GAME_INPUTS_TOKEN) { $headers["Authorization"] = $env:GAME_INPUTS_TOKEN }
          $zip = Join-Path $env:RUNNER_TEMP "game-inputs.zip"
          Invoke-WebRequest -Uri $env:GAME_INPUTS_URL -Headers $headers -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath .
          if (-not (Test-Path "generated/v143/layout.json")) {
            Write-Host "::error::Game inputs zip did not contain generated/v143/layout.json"
            exit 1
          }
          Write-Host "Restored generated/:"
          Get-ChildItem generated | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Build shader translator (no game bytes in repo)
        shell: pwsh
        run: .venv\Scripts\python tools\build_xlate.py

      - name: Assemble TotK-Setup release folder + zip
        shell: pwsh
        env:
          PROVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.prove) || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          $out = "build/release/TotK-Setup"
          $zip = "build/release/TotK-Setup-${{ inputs.tag || github.ref_name }}-windows.zip"
          $extra = @()
          if ($env:PROVE -eq "true" -and (Test-Path "build/extracted/v143")) {
            $extra += "--prove"
          } elseif ($env:PROVE -eq "true") {
            Write-Host "::warning::prove requested but build/extracted/v143 is absent; packaging without --prove"
          }
          .venv-py314\Scripts\python tools\make_release.py --out $out --zip $zip @extra

      - name: Content guard on checkout (post-restore sanity)
        shell: pwsh
        run: .venv\Scripts\python tools\check_content.py

      - name: SHA256
        shell: pwsh
        run: |
          $zip = Get-ChildItem build/release/*.zip | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $zip.FullName).Hash.ToLower()
          "$hash  $($zip.Name)" | Set-Content -Encoding ascii build/release/SHA256SUMS.txt
          Get-Content build/release/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TotK-Setup-windows
          path: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: GitHub Release (tags, or a manual run with a tag name)
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            build/release/*.zip
            build/release/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
